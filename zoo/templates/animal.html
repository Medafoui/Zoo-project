{% extends 'base.html' %}
{%block title%} Animal view {%endblock%}

{%block scipts%}
{%endblock%}

{%block content%}

<section>
    <h2 class="animal_title">{{animal.name}}</h2>
    <section class="animal-description">
        <div class="form" style="display: flex;width:100%;height: auto;">

            <img src="{{ url_for('static', filename=animal.img_path) }}"  width=150px style = "border-radius: 15px;">

            <p style="padding-left: 25px;text-align: left;">
                <b>Name:</b>&nbsp;{{animal.name}}<br><br>
                <b>Description:</b>&nbsp;{{animal.information}}<br><br>
           </p>
        </div>
    </section>

  


</section>
{%endblock%}
